name: Build and Publish Extension

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Publish
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: 安装依赖
        run: npm ci
        
      - name: 编译 TypeScript
        run: npm run compile
        
      - name: 安装打包工具
        run: npm install -g @vscode/vsce
        
      - name: 打包 VSIX
        run: vsce package --no-yarn
        
      - name: 提取版本更新内容
        id: extract_changelog
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "版本: $VERSION"
          
          if [ -f CHANGELOG.md ]; then
            CHANGELOG=$(awk -v ver="$VERSION" '
              BEGIN { print_content = 0 }
              /^## \[/ && $0 ~ ver { print_content = 1; next }
              /^## \[/ && print_content { exit }
              print_content { print }
            ' CHANGELOG.md)
            
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="版本 $VERSION 发布"
            fi
          else
            CHANGELOG="版本 $VERSION 发布"
          fi
          
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./*.vsix
          body: ${{ steps.extract_changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 发布到 VS Code 市场
        run: |
          echo "🚀 发布到 VS Code 市场..."
          vsce publish -p ${{ secrets.VSCODE_MARKETPLACE_TOKEN }}
          
      - name: 发布成功
        if: success()
        run: |
          echo "✅ 发布成功！"
          echo "🌐 https://marketplace.visualstudio.com/items?itemName=gjcloak.eu4-special-escape"