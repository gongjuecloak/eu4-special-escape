name: Build VSIX Package

on:
  push:
    tags:
      - 'v*'  # 当推送 v1.0.0, v2.1.3 等标签时触发
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    name: Build Extension
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: 安装依赖
        run: npm ci
        
      - name: 编译 TypeScript
        run: npm run compile
        
      - name: 安装打包工具
        run: npm install -g @vscode/vsce
        
      - name: 打包 VSIX
        run: vsce package --no-yarn
        
      - name: 提取版本更新内容
        id: extract_changelog
        run: |
          # 获取当前版本号
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "版本: $VERSION"
          
          # 从 CHANGELOG.md 提取对应版本的内容
          # 查找 ## [$VERSION] 或 ## v$VERSION 到下一个 ## 之间的内容
          if [ -f CHANGELOG.md ]; then
            CHANGELOG=$(awk -v ver="$VERSION" '
              BEGIN { print_content = 0 }
              /^## \[/ && $0 ~ ver { print_content = 1; next }
              /^## \[/ && print_content { exit }
              print_content { print }
            ' CHANGELOG.md)
            
            # 如果没有找到，尝试匹配 ## v$VERSION
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG=$(awk -v ver="$VERSION" '
                BEGIN { print_content = 0 }
                /^## v/ && $0 ~ ver { print_content = 1; next }
                /^## / && print_content { exit }
                print_content { print }
              ' CHANGELOG.md)
            fi
            
            # 如果还是没有找到，使用默认内容
            if [ -z "$CHANGELOG" ]; then
              CHANGELOG="版本 $VERSION 发布"
            fi
          else
            CHANGELOG="版本 $VERSION 发布"
          fi
          
          # 保存到环境变量
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
      - name: 上传打包文件
        uses: actions/upload-artifact@v4
        with:
          name: eu4-special-escape
          path: ./*.vsix
          
      - name: 创建 Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./*.vsix
          body: ${{ steps.extract_changelog.outputs.changelog }}
          generate_release_notes: false
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}